name: trump-truth-social-archive (no S3)

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */4 * * *'  # every 4 hours at :47

permissions:
  contents: write  # needed so the workflow can push commits

concurrency:
  group: trump-truth-archive
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check existing archive
        run: python check_archive.py

      - name: Run scraper
        env:
          SCRAPE_PROXY_KEY: ${{ secrets.SCRAPE_PROXY_KEY }}
        run: |
          set -e
          python scrape.py

      - name: Check updated archive
        run: python check_archive.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "chore: update cumulative Truth Social archive"
          file_pattern: "data/truth_archive.json data/truth_archive.csv"
